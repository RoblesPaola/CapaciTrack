  .topbar nav a {

  .main-content {

  .breadcrumb {
    margin-bottom: 20px;

  }

  .section {

  .modulo-video {

    height: 450px;
    border-radius: 8px;
  }

  .archivo-descarga {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 15px;
    background: #e8f5e9;

  .archivo-icono {

  }

  .archivo-info {
    flex: 1;
  }

  .archivo-nombre {
    font-weight: 600;
    color: #333;
    margin-bottom: 5px;
  }

  .archivo-detalles {
    font-size: 0.85rem;

  .btn-descargar {

    align-items: center;

  }

  .btn-descargar:hover {
    background: #1b5e20;
  }

  .pregunta-item {
    background: #f9f9f9;
    padding: 20px;
    border-radius: 8px;
    margin-bottom: 15px;
  }

  .pregunta-numero {
    font-weight: 600;
    color: #2e7d32;
    margin-bottom: 10px;
  }

  .pregunta-texto {
    font-size: 1.05rem;
    margin-bottom: 15px;
    color: #333;
  }

  .opciones-lista {
    margin-left: 20px;
  }

  .opcion {
    padding: 8px 0;

  }

  .opcion.correcta {
    color: #2e7d32;

  .btn {
    padding: 12px 24px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1rem;
    text-decoration: none;

  }

  .btn-primary {
    background: #2e7d32;

  }

  .btn-secondary {

    color: #fff;
  }

  .loading {

  }

    font-size: 3rem;

  .error-message {

  /* Modal para ver imágenes en grande */
  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;

    justify-content: center;
  }

  .modal.active {
    display: flex;

  .modal-content {
    max-width: 90%;

  .modal-close {
    position: absolute;

    color: #fff;

    cursor: pointer;
  }

  .no-contenido {
    padding: 20px;
    text-align: center;
    color: #999;
    font-style: italic;
  }

  /*cerrar sesion*/
    .modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);
  display: none;
  justify-content: center;
  align-items: center;

}

  background: #fff;
  padding: 30px;
  width: 400px;
  border-radius: 14px;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);

.modal-box h2 {
  margin-bottom: 10px;
  color: #19aa1e;
}

.modal-box p {
  color: #555;
  margin-bottom: 25px;
}

.modal-actions {
  display: flex;
  justify-content: center;
  gap: 15px;

.btn-cancelar {
  background: #e5e5e5;
  border: none;

  cursor: pointer;

.btn-confirmar:hover {

    transform: scale(0.9);
  }

/* Icono hamburguesa */
.menu-toggle {

  font-size: 28px;
  cursor: pointer;
  color: #2e7d32;
}

/* Responsive: menú hamburguesa */

  .topbar nav {
    display: none; /* Oculto por defecto */

    gap: 0;

</style>

<body>

<header class="topbar">
  <div class="logo-container">
    <img src="assets/logo.png" alt="Logo">
    <a href="paneladmin.html">CapaciTrack</a>
  </div>
<div class="menu-toggle" id="menu-toggle">
  <i class="fas fa-bars"></i> <!-- Icono hamburguesa -->
</div>
    <nav id="nav-menu">
      <a href="registrousuarios.html">Registro de Usuarios</a>
      <a href="registrodocs.html">Registro de Documentos</a>
      <a href="perfil-admin.html">Perfil</a>
         <a href="#" onclick="abrirModalCerrarSesion(event)">Cerrar Sesión</a>
    </nav>
</header>

<main class="main-content">
  <div class="breadcrumb">
    <a href="paneladmin.html">Inicio</a> / 
    <a href="ver-cursos.html">Cursos</a> / 
    <span id="breadcrumbTitulo">Detalle</span>
  </div>

  <div id="loading" class="loading">
    <i class="fas fa-spinner"></i>
    <p>Cargando curso...</p>
  </div>

  <div id="errorContainer" style="display:none;">
    <div class="error-message">
      <i class="fas fa-exclamation-circle" style="font-size:2rem;"></i>
      <h3>Error al cargar el curso</h3>
      <p id="errorMessage"></p>
      <br>
      <a href="ver-cursos.html" class="btn btn-primary">Volver a Cursos</a>
    </div>
  </div>

  <div id="cursoContainer" style="display:none;">
    <!-- El contenido se cargará dinámicamente -->
  </div>
</main>

<footer>© 2026 CapaciTrack</footer>

<!-- Modal para ver imágenes -->
<div id="imageModal" class="modal" onclick="closeModal()">
  <span class="modal-close">&times;</span>
  <img class="modal-content" id="modalImage">
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const cursoId = urlParams.get('id');
const backendURL = 'http://localhost/capacitrack/backend/';

if (!cursoId) {
  mostrarError('No se especificó un ID de curso');
} else {
  cargarCursoDetalle(cursoId);
}

async function cargarCursoDetalle(id) {
  try {
    const res = await fetch(`${backendURL}obtener_curso_detalle.php?id=${id}`);
    const data = await res.json();
    
    document.getElementById('loading').style.display = 'none';
    
    if (data.success) {
      mostrarCurso(data.curso);
    } else {
      mostrarError(data.message || 'Error al cargar el curso');
    }
  } catch (error) {
    console.error('Error:', error);
    mostrarError('Error de conexión al servidor');
  }
}

function mostrarCurso(curso) {
  document.getElementById('breadcrumbTitulo').textContent = curso.titulo;
  document.getElementById('cursoContainer').style.display = 'block';
  
  let portadaHTML = '';
  if (curso.portada && curso.portada !== '') {
    portadaHTML = `<img src="${backendURL}${curso.portada}" 
                       alt="${curso.titulo}" 
                       class="curso-portada-grande">`;
  }
  
  let modulosHTML = '';
  if (curso.modulos && curso.modulos.length > 0) {
    modulosHTML = curso.modulos.map((mod, index) => {
      let contenidoHTML = '';
      
      if (mod.archivo && mod.archivo !== '') {
        const extension = obtenerExtension(mod.archivo);
        const tipoArchivo = mod.tipo_contenido || detectarTipoArchivo(extension);
        
        contenidoHTML = generarVisualizadorArchivo(mod.archivo, tipoArchivo, extension, mod.titulo);
      } else {
        contenidoHTML = '<div class="no-contenido">Este módulo no tiene archivos adjuntos</div>';
      }
      
      return `
        <div class="modulo-item">
          <div class="modulo-header">
            <div>
              <div class="modulo-titulo">Módulo ${index + 1}: ${mod.titulo}</div>
              ${mod.tipo_contenido ? `<span class="modulo-tipo"><i class="fas fa-${obtenerIconoTipo(mod.tipo_contenido)}"></i> ${mod.tipo_contenido}</span>` : ''}
            </div>
          </div>
          <div class="modulo-descripcion">${mod.descripcion || 'Sin descripción'}</div>
          <div class="modulo-contenido">
            ${contenidoHTML}
          </div>
        </div>
      `;
    }).join('');
  } else {
    modulosHTML = '<p style="color:#999;">No hay módulos en este curso</p>';
  }
  
  let evaluacionesHTML = '';
  if (curso.evaluaciones && curso.evaluaciones.length > 0) {
    evaluacionesHTML = curso.evaluaciones.map((eval, index) => {
      let opcionesHTML = '';
      
      if (eval.tipo === 'opcion' && eval.opciones) {
        const opciones = JSON.parse(eval.opciones);
        opcionesHTML = '<div class="opciones-lista">';
        opciones.forEach((opcion, i) => {
          const letra = String.fromCharCode(65 + i);
          const esCorrecta = letra === eval.respuesta_correcta;
          opcionesHTML += `<div class="opcion ${esCorrecta ? 'correcta' : ''}">${letra}) ${opcion}</div>`;
        });
        opcionesHTML += '</div>';
      }
      
      return `
        <div class="pregunta-item">
          <div class="pregunta-numero">Pregunta ${index + 1} - ${eval.tipo === 'abierta' ? 'Abierta' : 'Opción Múltiple'}</div>
          <div class="pregunta-texto">${eval.pregunta}</div>
          ${opcionesHTML}
        </div>
      `;
    }).join('');
  } else {
    evaluacionesHTML = '<p style="color:#999;">No hay evaluaciones en este curso</p>';
  }
  
  const html = `
    <div class="curso-header">
      ${portadaHTML}
      <h1 class="curso-titulo">${curso.titulo}</h1>
      <div class="curso-meta">
        <span><i class="fas fa-user"></i> ${curso.creador_nombre || 'Desconocido'}</span>
        <span><i class="fas fa-calendar"></i> ${formatearFecha(curso.creado_en)}</span>
        <span><i class="fas fa-book"></i> ${curso.modulos.length} módulos</span>
        <span><i class="fas fa-question-circle"></i> ${curso.evaluaciones.length} preguntas</span>
      </div>
      <div class="curso-descripcion">${curso.descripcion}</div>
    </div>

    <div class="section">
      <h2 class="section-title">
        <i class="fas fa-book"></i>
        Módulos del Curso
      </h2>
      ${modulosHTML}
    </div>

    <div class="section">
      <h2 class="section-title">
        <i class="fas fa-question-circle"></i>
        Evaluación
      </h2>
      ${evaluacionesHTML}
    </div>

    <div style="display:flex; gap:15px; justify-content:center; margin-top:30px;">
      <a href="ver-cursos.html" class="btn btn-secondary">
        <i class="fas fa-arrow-left"></i> Volver
      </a>
      <a href="editar-curso.html?id=${curso.id}" class="btn btn-primary">
        <i class="fas fa-edit"></i> Editar Curso
      </a>
    </div>
  `;
  
  document.getElementById('cursoContainer').innerHTML = html;
}

function generarVisualizadorArchivo(rutaArchivo, tipo, extension, titulo) {
  const urlCompleta = `${backendURL}${rutaArchivo}`;
  
  // Imágenes
  if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp'].includes(extension) || tipo === 'imagen') {
    return `
      <img src="${urlCompleta}" 
           alt="${titulo}" 
           class="modulo-imagen"
           onclick="openModal('${urlCompleta}')"
           onerror="this.parentElement.innerHTML='<div class=\\'no-contenido\\'>Error al cargar la imagen</div>'">
    `;
  }
  
  // PDFs
  if (extension === 'pdf' || tipo === 'pdf') {
    return `
      <iframe src="${urlCompleta}" 
              class="modulo-pdf"
              title="${titulo}"></iframe>
      <div style="margin-top:10px;">
        <a href="${urlCompleta}" target="_blank" class="btn-descargar">
          <i class="fas fa-download"></i> Descargar PDF
        </a>
      </div>
    `;
  }
  
  // Videos
  if (['mp4', 'webm', 'ogg'].includes(extension) || tipo === 'video') {
    return `
      <video controls class="modulo-video">
        <source src="${urlCompleta}" type="video/${extension}">
        Tu navegador no soporta el elemento de video.
      </video>
    `;
  }
  
  // Audio
  if (['mp3', 'wav', 'ogg'].includes(extension)) {
    return `
      <audio controls style="width:100%;">
        <source src="${urlCompleta}" type="audio/${extension}">
        Tu navegador no soporta el elemento de audio.
      </audio>
      <div style="margin-top:10px;">
        <a href="${urlCompleta}" download class="btn-descargar">
          <i class="fas fa-download"></i> Descargar Audio
        </a>
      </div>
    `;
  }
  
  // Documentos y otros archivos
  const iconos = {
    'doc': 'file-word',
    'docx': 'file-word',
    'xls': 'file-excel',
    'xlsx': 'file-excel',
    'ppt': 'file-powerpoint',
    'pptx': 'file-powerpoint',
    'txt': 'file-alt',
    'zip': 'file-archive',
    'rar': 'file-archive'
  };
  
  const icono = iconos[extension] || 'file';
  const nombreArchivo = rutaArchivo.split('/').pop();
  
  return `
    <div class="archivo-descarga">
      <div class="archivo-icono">
        <i class="fas fa-${icono}"></i>
      </div>
      <div class="archivo-info">
        <div class="archivo-nombre">${nombreArchivo}</div>
        <div class="archivo-detalles">Tipo: ${extension.toUpperCase()} • ${tipo || 'Documento'}</div>
      </div>
      <a href="${urlCompleta}" download class="btn-descargar">
        <i class="fas fa-download"></i> Descargar
      </a>
    </div>
  `;
}

function obtenerExtension(rutaArchivo) {
  return rutaArchivo.split('.').pop().toLowerCase();
}

function detectarTipoArchivo(extension) {
  const tipos = {
    'jpg': 'imagen', 'jpeg': 'imagen', 'png': 'imagen', 'gif': 'imagen', 'webp': 'imagen',
    'pdf': 'pdf',
    'mp4': 'video', 'webm': 'video', 'ogg': 'video',
    'doc': 'documento', 'docx': 'documento', 'txt': 'documento',
    'xls': 'documento', 'xlsx': 'documento',
    'ppt': 'documento', 'pptx': 'documento'
  };
  return tipos[extension] || 'documento';
}

function obtenerIconoTipo(tipo) {
  const iconos = {
    'video': 'video',
    'pdf': 'file-pdf',
    'imagen': 'image',
    'documento': 'file-alt'
  };
  return iconos[tipo] || 'file';
}

function openModal(imageSrc) {
  const modal = document.getElementById('imageModal');
  const modalImg = document.getElementById('modalImage');
  modal.classList.add('active');
  modalImg.src = imageSrc;
}

function closeModal() {
  document.getElementById('imageModal').classList.remove('active');
}

function mostrarError(mensaje) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('errorContainer').style.display = 'block';
  document.getElementById('errorMessage').textContent = mensaje;
}

function formatearFecha(fecha) {
  const date = new Date(fecha);
  return date.toLocaleDateString('es-MX', { 
    year: 'numeric', 
    month: 'long', 
    day: 'numeric' 
  });
}
</script>

<!-- MODAL CERRAR SESIÓN -->

  <div class="modal-box">
    <h2>⚠️ Cerrar sesión</h2>
    <p>¿Seguro que deseas cerrar la sesión?</p>

    <div class="modal-actions">
      <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-confirmar" onclick="confirmarCerrarSesion()">Cerrar sesión</button>
    </div>
  </div>
</div>

  document.getElementById("modalCerrarSesion").style.display = "flex";
}

function cerrarModal() {
  document.getElementById("modalCerrarSesion").style.display = "none";
}

function confirmarCerrarSesion() {
  // Si usas sesiones o tokens, aquí los limpias
  // localStorage.clear();
  // sessionStorage.clear();

  window.location.href = "index.html";
}

const menuToggle = document.getElementById('menu-toggle');
const navMenu = document.getElementById('nav-menu');

menuToggle.addEventListener('click', () => {
  navMenu.classList.toggle('show'); // Agrega/quita clase para mostrar menú
});
</script>
