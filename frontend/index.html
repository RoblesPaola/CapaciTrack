<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CapaciTrack | Login</title>
    <!-- Enlace al manifest -->
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#4f46e5">
  <link rel="stylesheet" href="assets/css/login.css" />
</head>
<body>

  <div class="login-page">
    <div class="login-card">

       <!-- NO TOCAR CODIGO YA FUNCIONA -->
      <img src="assets/logo.png" alt="CapaciTrack Logo" class="logo" />

      <h2>Bienvenido</h2>

      <!-- FORMULARIO -->
      <form id="loginForm">

            <label>Correo</label>
      <input type="text" id="email" />

      <label>Contraseña</label>
      <input type="password" id="password" />

        <a href="#" class="forgot">
          En caso de olvidar la contraseña comunicarse al numero: 4891096054
        </a>

        <button type="submit">Iniciar sesión</button>

        <p id="error" style="color:red; margin-top:10px;"></p>

      </form>

      <p class="footer-text">
        Si aún no tienes una cuenta solicita acceso al número:
        <br />
        <strong>+52 4891096054</strong>
      </p>

    </div>
  </div>

  <footer class="footer">
    <img src="assets/esr.png" alt="Logo Empresa Izquierdo" class="footer-logo left">
    <p>&copy; 2026 CapaciTrack. Todos los derechos reservados.</p>
    <img src="assets/Grupo-Gusi.png" alt="Logo Empresa Derecho" class="footer-logo right">
  </footer>

  <!-- JS DEL LOGIN -->
 <script src="assets/js/login.js"></script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('../service-worker.js')
      .then(reg => console.log('Service Worker registrado', reg))
      .catch(err => console.log('Error al registrar SW:', err));
  });
}
</script>

</body>
</html>
