<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Cursos | CapaciTrack</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/global.css">
</head>
<body>

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="logo-container">
      <img src="assets/logo.png" alt="CapaciTrack">
      <a href="panelusuarios.html">CapaciTrack</a>
    </div>
    <div id="bienvenida">Bienvenido</div>
    <div class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></div>
    <nav id="nav-menu">
      <a href="catalogo-curso.html"><i class="fas fa-book"></i> Catálogo</a>
      <a href="mis-cursos.html" class="active"><i class="fas fa-graduation-cap"></i> Mis Cursos</a>
      <a href="perfil.html"><i class="fas fa-user-circle"></i> Perfil</a>
      <a href="#" onclick="abrirModalCerrarSesion(event)"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
    </nav>
  </header>

  <!-- MAIN -->
  <main class="main-content">
    <div style="background:linear-gradient(135deg,var(--primary-darker) 0%,var(--primary) 60%,#4ade80 100%);border-radius:var(--radius-xl);padding:26px 32px;color:#fff;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;gap:20px;position:relative;overflow:hidden;">
      <div style="position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none;"></div>
      <div style="position:relative;z-index:1;">
        <div style="display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);padding:4px 12px;border-radius:50px;font-size:.78rem;font-weight:600;color:#fff;margin-bottom:8px;"><i class="fas fa-graduation-cap"></i> Mi Aprendizaje</div>
        <h1 style="font-size:1.4rem;font-weight:800;color:#fff;-webkit-text-fill-color:#fff;background:none;margin:0 0 4px;">Mis Cursos</h1>
        <p style="color:rgba(255,255,255,.75);font-size:.88rem;margin:0;">Continúa tu capacitación profesional en Grupo Gusi</p>
      </div>
      <div style="width:52px;height:52px;border-radius:var(--radius-md);background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:#fff;flex-shrink:0;z-index:1;"><i class="fas fa-book-open"></i></div>
    </div>
    <div id="listaCursos"></div>
  </main>

  <!-- FOOTER -->
  <footer>
    <img src="assets/esr.png" class="footer-logo left" alt="ESR">
    <p>&copy; 2026 CapaciTrack. Todos los derechos reservados.</p>
    <img src="assets/Grupo-Gusi.png" class="footer-logo right" alt="Grupo Gusi">
  </footer>

  <!-- MODAL CERRAR SESIÓN -->
  <div id="modalCerrarSesion" class="modal-overlay">
    <div class="modal-box">
      <h2>🚪 Cerrar sesión</h2>
      <p>¿Seguro que deseas cerrar la sesión?</p>
      <div class="modal-actions">
        <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
        <button class="btn-confirmar" onclick="confirmarCerrarSesion()">Cerrar sesión</button>
      </div>
    </div>
  </div>

  <script>
    let cursosData = [];

    fetch("/capacitrack/backend/auth/usuario_actual.php", { credentials: "include" })
      .then(r => r.json())
      .then(d => {
        if (d.success) {
          document.getElementById("bienvenida").textContent = "Hola, " + d.nombre;
          cargarMisCursos();
        } else {
          document.getElementById("listaCursos").innerHTML = "<p>No se pudo identificar al usuario.</p>";
        }
      });

    function cargarMisCursos() {
      fetch("http://localhost/capacitrack/backend/mis_cursos.php")
        .then(r => r.json())
        .then(cursos => {
          const contenedor = document.getElementById("listaCursos");

          if (!cursos || cursos.length === 0) {
            contenedor.innerHTML = `
              <div class="empty-state">
                <i class="fas fa-book-open"></i>
                <h3>Sin cursos inscritos</h3>
                <p>Aún no estás inscrito en ningún curso.</p>
                <a href="catalogo-curso.html" class="btn btn-primary" style="margin-top:16px;">
                  <i class="fas fa-search"></i> Ver Catálogo
                </a>
              </div>`;
            return;
          }

          contenedor.innerHTML = "";
          cursos.forEach(curso => {
            const card = document.createElement("div");
            card.className = "curso-card";
            card.innerHTML = `
              <div class="curso-card-image">
                ${curso.portada
                  ? `<img src="http://localhost/capacitrack/backend/${curso.portada}" alt="${curso.nombre || curso.titulo}">`
                  : `<div class="portada-placeholder"><i class="fas fa-graduation-cap"></i></div>`}
              </div>
              <div class="curso-card-content">
                <h3>${curso.nombre || curso.titulo}</h3>
                <p>${curso.descripcion || "Sin descripción disponible"}</p>
                <button onclick="verCurso(${curso.id})">
                  <i class="fas fa-play"></i> Entrar al curso
                </button>
              </div>`;
            contenedor.appendChild(card);
          });
          cursosData = cursos;
        })
        .catch(err => {
          console.error("Error:", err);
          document.getElementById("listaCursos").innerHTML = "<p>Error al cargar tus cursos.</p>";
        });
    }

    function verCurso(id) { window.location.href = "curso.html?id=" + id; }

    function abrirModalCerrarSesion(e) { e.preventDefault(); document.getElementById("modalCerrarSesion").style.display = "flex"; }
    function cerrarModal() { document.getElementById("modalCerrarSesion").style.display = "none"; }
    function confirmarCerrarSesion() { window.location.href = "index.html"; }

    document.getElementById('menu-toggle').addEventListener('click', () => {
      document.getElementById('nav-menu').classList.toggle('show');
    });
  </script>

</body>
</html>
