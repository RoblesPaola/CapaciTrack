<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curso | CapaciTrack</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/global.css">

<style>
  .main-content {
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
  }

  .breadcrumb {
    margin-bottom: 20px;
    color: #666;
  }

  .breadcrumb a {
    color: #2e7d32;
    text-decoration: none;
  }

  /* Header del curso */
  .curso-header {
    background: #fff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 30px;
  }

  .curso-info-grid {
    display: grid;
    grid-template-columns: 250px 1fr auto;
    gap: 25px;
    align-items: start;
  }

  .curso-portada-pequena {
    width: 250px;
    height: 180px;
    object-fit: cover;
    border-radius: 8px;
  }

  .curso-info-texto {
    flex: 1;
  }

  .curso-titulo {
    font-size: 2rem;
    color: #2e7d32;
    margin-bottom: 15px;
  }

  .curso-meta {
    display: flex;
    gap: 20px;
    color: #666;
    font-size: 0.9rem;
    margin-bottom: 15px;
    flex-wrap: wrap;
  }

  .curso-descripcion {
    line-height: 1.6;
    color: #555;
  }

  /* Barra de progreso en el header */
  .progreso-curso-header {
    min-width: 200px;
  }

  .progreso-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .progreso-header span {
    font-weight: 600;
    color: #2e7d32;
    font-size: 0.9rem;
  }

  .progreso-porcentaje {
    font-size: 1.8rem;
    font-weight: 700;
    color: #2e7d32;
  }

  .barra-progreso {
    width: 100%;
    height: 12px;
    background: #e0e0e0;
    border-radius: 20px;
    overflow: hidden;
  }

  .barra-progreso-fill {
    display: block;
    height: 100%;
    background: linear-gradient(90deg, #66bb6a, #2e7d32);
    width: 0%;
    transition: width 0.6s ease;
  }

  /* Layout principal con sidebar */
  .curso-container {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 25px;
    align-items: start;
  }

  /* Sidebar con módulos */
  .sidebar-modulos {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    padding: 20px;
    position: sticky;
    top: 20px;
    max-height: calc(100vh - 120px);
    overflow-y: auto;
  }

  .sidebar-titulo {
    font-size: 1.3rem;
    color: #2e7d32;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .modulo-nav-item {
    padding: 12px 15px;
    margin-bottom: 8px;
    border-radius: 8px;
    cursor: pointer;
    border: 2px solid #e0e0e0;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .modulo-nav-item:hover {
    border-color: #2e7d32;
    background: #f1f8f4;
  }

  .modulo-nav-item.active {
    background: #e8f5e9;
    border-color: #2e7d32;
    font-weight: 600;
  }

  .modulo-nav-item.completado {
    border-color: #4caf50;
    background: #e8f5e9;
  }

  .modulo-nav-item .icono {
    font-size: 1.2rem;
    color: #666;
  }

  .modulo-nav-item.active .icono {
    color: #2e7d32;
  }

  .modulo-nav-item.completado .icono {
    color: #4caf50;
  }

  .modulo-nav-texto {
    flex: 1;
    font-size: 0.95rem;
  }

  .check-completado {
    color: #4caf50;
    font-size: 1.2rem;
  }

  /* Área de contenido principal */
  .contenido-area {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    padding: 30px;
    min-height: 500px;
  }

  .contenido-header {
    border-bottom: 2px solid #e0e0e0;
    padding-bottom: 20px;
    margin-bottom: 25px;
  }

  .contenido-tipo {
    display: inline-block;
    padding: 6px 14px;
    background: #e8f5e9;
    color: #2e7d32;
    border-radius: 20px;
    font-size: 0.85rem;
    margin-bottom: 12px;
  }

  .contenido-titulo {
    font-size: 1.8rem;
    color: #333;
    margin-bottom: 12px;
  }

  .contenido-descripcion {
    color: #666;
    line-height: 1.6;
  }

  /* Visualizadores de contenido */
  .modulo-imagen {
    width: 100%;
    max-width: 100%;
    height: auto;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    cursor: pointer;
    transition: transform 0.2s;
  }

  .modulo-imagen:hover {
    transform: scale(1.02);
  }

  .modulo-pdf {
    width: 100%;
    height: 600px;
    border: none;
    border-radius: 8px;
  }

  .modulo-video {
    width: 100%;
    height: 500px;
    border-radius: 8px;
  }

  .archivo-descarga {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 20px;
    background: #f9f9f9;
    border-radius: 8px;
    border-left: 4px solid #2e7d32;
  }

  .archivo-icono {
    font-size: 2.5rem;
    color: #2e7d32;
  }

  .archivo-info {
    flex: 1;
  }

  .archivo-nombre {
    font-weight: 600;
    color: #333;
    margin-bottom: 5px;
  }

  .archivo-detalles {
    font-size: 0.85rem;
    color: #666;
  }

  .btn-descargar {
    padding: 10px 20px;
    background: #2e7d32;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: background 0.2s;
  }

  .btn-descargar:hover {
    background: #1b5e20;
  }

  /* Evaluación */
  .evaluacion-container {
    max-width: 800px;
  }

  .pregunta-item {
    background: #f9f9f9;
    padding: 25px;
    border-radius: 8px;
    margin-bottom: 20px;
    border: 2px solid #e0e0e0;
  }

  .pregunta-numero {
    font-weight: 600;
    color: #2e7d32;
    margin-bottom: 10px;
  }

  .pregunta-texto {
    font-size: 1.1rem;
    margin-bottom: 20px;
    color: #333;
  }

  .opciones-lista {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .opcion {
    padding: 12px 15px;
    margin-bottom: 10px;
    background: #fff;
    border: 2px solid #e0e0e0;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .opcion:hover:not(.disabled) {
    border-color: #2e7d32;
    background: #f1f8f4;
  }

  .opcion input[type="radio"] {
    cursor: pointer;
    width: 18px;
    height: 18px;
  }

  .opcion.correcta-mostrada {
    border-color: #4caf50;
    background: #e8f5e9;
    font-weight: 600;
  }

  .opcion.incorrecta-mostrada {
    border-color: #f44336;
    background: #ffebee;
  }

  .opcion.disabled {
    cursor: not-allowed;
    opacity: 0.7;
  }

  .resultado-pregunta {
    margin-top: 15px;
    padding: 12px 15px;
    border-radius: 6px;
    font-weight: 600;
    display: none;
  }

  .resultado-pregunta.correcto {
    background: #e8f5e9;
    color: #2e7d32;
    display: block;
  }

  .resultado-pregunta.incorrecto {
    background: #ffebee;
    color: #c62828;
    display: block;
  }

  .evaluacion-resultado {
    background: #f9f9f9;
    padding: 25px;
    border-radius: 8px;
    margin-top: 25px;
    text-align: center;
    display: none;
  }

  .evaluacion-resultado.aprobado {
    background: #e8f5e9;
    border: 2px solid #4caf50;
  }

  .evaluacion-resultado.reprobado {
    background: #ffebee;
    border: 2px solid #f44336;
  }

  .evaluacion-resultado h3 {
    font-size: 1.5rem;
    margin-bottom: 15px;
  }

  .evaluacion-resultado.aprobado h3 {
    color: #2e7d32;
  }

  .evaluacion-resultado.reprobado h3 {
    color: #c62828;
  }

  /* Botones de navegación */
  .navegacion-botones {
    display: flex;
    justify-content: space-between;
    margin-top: 30px;
    padding-top: 20px;
    border-top: 2px solid #e0e0e0;
  }

  .btn {
    padding: 12px 24px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1rem;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s;
  }

  .btn-primary {
    background: #2e7d32;
    color: #fff;
  }

  .btn-primary:hover {
    background: #1b5e20;
  }

  .btn-secondary {
    background: #757575;
    color: #fff;
  }

  .btn-secondary:hover {
    background: #616161;
  }

  .btn:disabled {
    background: #ccc;
    cursor: not-allowed;
    opacity: 0.6;
  }

  /* Checkbox completado */
  .modulo-completado {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 25px;
    padding: 15px;
    background: #f9f9f9;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.3s;
  }

  .modulo-completado:hover {
    background: #f0f0f0;
  }

  .modulo-completado input[type="checkbox"] {
    width: 22px;
    height: 22px;
    cursor: pointer;
    accent-color: #2e7d32;
  }

  .modulo-completado label {
    cursor: pointer;
    font-weight: 500;
    color: #555;
    user-select: none;
  }

  .modulo-completado.completado {
    background: #e8f5e9;
  }

  .modulo-completado.completado label {
    color: #2e7d32;
  }

  .no-contenido {
    padding: 40px;
    text-align: center;
    color: #999;
    font-style: italic;
  }

  .loading {
    text-align: center;
    padding: 60px;
    color: #2e7d32;
  }

  .loading i {
    font-size: 3rem;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .error-message {
    background: #ffebee;
    color: #c62828;
    padding: 20px;
    border-radius: 8px;
    text-align: center;
  }

  /* Modal para imágenes */
  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.9);
    align-items: center;
    justify-content: center;
  }

  .modal.active {
    display: flex;
  }

  .modal-content {
    max-width: 90%;
    max-height: 90%;
  }

  .modal-close {
    position: absolute;
    top: 20px;
    right: 40px;
    color: #fff;
    font-size: 40px;
    font-weight: bold;
    cursor: pointer;
  }


/* =========================
   RESPONSIVE GENERAL APP
========================= */

@media screen and (max-width: 992px) {

  /* Header curso */
  .curso-info-grid {
    grid-template-columns: 1fr;
  }

  .curso-portada-pequena {
    width: 100%;
    height: auto;
  }

  /* Layout principal */
  .curso-container {
    grid-template-columns: 1fr;
  }

  .sidebar-modulos {
    position: relative;
    top: 0;
    max-height: none;
  }

  .contenido-area {
    padding: 20px;
  }

  .pregunta-item {
    padding: 18px;
  }

  .navegacion-botones {
    flex-direction: column;
    gap: 10px;
  }

  .navegacion-botones .btn {
    width: 100%;
  }
}
.modulo-imagen {
  width: 100%;
  max-width: 100%;
  max-height: 220px;
  object-fit: contain;
  border-radius: 8px;
  display: block;
  margin: 12px auto;
}

@media screen and (max-width: 480px) {
  .modulo-imagen {
    max-height: 180px;
  }
}
</style>
</head>

  <nav id="nav-menu">

    <a href="mis-cursos.html" class="active"><i class="fas fa-graduation-cap"></i> Mis Cursos</a>

<main class="main-content">
  <div class="breadcrumb" style="margin-bottom:20px;font-size:.85rem;color:var(--gray-500);">
    <a href="panelusuarios.html" style="color:var(--primary);text-decoration:none;">Inicio</a> &rsaquo;
    <a href="mis-cursos.html" style="color:var(--primary);text-decoration:none;">Mis Cursos</a> &rsaquo;
    <span id="breadcrumbTitulo">Curso</span>
  </div>

  <div class="modal-box">
    <h2>Cerrar sesión</h2>
    <p>¿Seguro que deseas salir de la plataforma?</p>
    <div class="modal-actions">
      <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-confirmar" onclick="confirmarCerrarSesion()">Salir</button>

<script>
  fetch("/capacitrack/backend/auth/usuario_actual.php", { credentials: "include" })
    .then(r => r.json())
    .then(d => { if (d.success) document.getElementById("bienvenida").textContent = "Hola, " + d.nombre; });

const urlParams = new URLSearchParams(window.location.search);
const cursoId   = urlParams.get('id');
const backendURL = '/capacitrack/backend/';

// Variables globales
let usuarioId          = null;
let cursoData          = null;
let indiceActual       = 0;
let modulosCompletados = []; // Array de IDs de módulos (integers desde la BD)
let respuestasEvaluacion = {};
let evaluacionCalificada  = false;
let notaEvaluacion        = null; // Puntuación 0-100, cargada/guardada en BD
let intentosEvaluacion    = 0;
let cursoYaFinalizado     = false;

// Verificar sesión primero, luego cargar curso
fetch('/capacitrack/backend/verificar_sesion.php', { credentials: 'include' })
  .then(res => res.json())
  .then(data => {
    if (!data.success) {
      window.location.href = 'index.html';
      return;
    }
    usuarioId = data.user_id;
    if (!cursoId) { mostrarError('No se especificó un ID de curso'); return; }
    cargarProgresoDesdeDB().then(() => cargarCursoDetalle(cursoId));
  })
  .catch(() => mostrarError('Error de conexión al verificar sesión'));

// Carga qué módulos completó el usuario y el estado de la inscripción desde la BD
async function cargarProgresoDesdeDB() {
  try {
    const res  = await fetch(`/capacitrack/backend/modulos/obtener_completados.php?curso_id=${cursoId}`, { credentials: 'include' });
    const data = await res.json();
    if (data.success) {
      modulosCompletados = (data.modulos_completados || []).map(Number);
      if (data.inscripcion) {
        const insc        = data.inscripcion;
        intentosEvaluacion = parseInt(insc.intentos_evaluacion) || 0;
        cursoYaFinalizado  = (insc.estado === 'finalizado');
        if (insc.nota_evaluacion !== null && insc.nota_evaluacion !== undefined) {
          notaEvaluacion    = parseInt(insc.nota_evaluacion);
          evaluacionCalificada = true;
        }
      }
    }
  } catch (e) {
    console.error('Error al cargar progreso:', e);
  }
}

async function guardarProgresoEnDB(porcentaje, opts = {}) {
  try {
    await fetch(`${backendURL}guardar_progreso.php`, {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ curso_id: cursoId, porcentaje, ...opts })
    });
  } catch (e) { console.error('Error al guardar progreso:', e); }
}

async function cargarCursoDetalle(id) {
  try {
    const res  = await fetch(`${backendURL}obtener_curso_detalle.php?id=${id}`, { credentials: 'include' });
    const data = await res.json();
    document.getElementById('loading').style.display = 'none';
    if (data.success) { cursoData = data.curso; mostrarCurso(data.curso); }
    else              { mostrarError(data.message || 'Error al cargar el curso'); }
  } catch (e) { mostrarError('Error de conexión al servidor'); }
}

function calcularPorcentajeProgreso() {
  if (!cursoData) return 0;
  const totalModulos    = cursoData.modulos ? cursoData.modulos.length : 0;
  const tieneEvaluacion = cursoData.evaluaciones && cursoData.evaluaciones.length > 0;
  if (totalModulos === 0 && !tieneEvaluacion) return 0;

  const modulosHechos = totalModulos > 0
    ? cursoData.modulos.filter(m => modulosCompletados.includes(Number(m.id))).length
    : 0;

  if (tieneEvaluacion) {
    const pctMod  = totalModulos > 0 ? (modulosHechos / totalModulos) * 70 : 70;
    const nota    = evaluacionCalificada ? (notaEvaluacion ?? calcularPorcentajeEvaluacion()) : 0;
    const pctEval = nota >= 80 ? 30 : 0;
    return Math.round(pctMod + pctEval);
  }
  return totalModulos > 0 ? Math.round((modulosHechos / totalModulos) * 100) : 0;
}

function actualizarBarraProgreso() {
  const pct = calcularPorcentajeProgreso();
  const fill = document.querySelector('.barra-progreso-fill');
  const txt  = document.querySelector('.progreso-porcentaje');
  if (fill) fill.style.width = `${pct}%`;
  if (txt)  txt.textContent  = `${pct}%`;
}

function mostrarCurso(curso) {
  document.getElementById('breadcrumbTitulo').textContent = curso.titulo;
  document.getElementById('cursoContainer').style.display = 'block';

  let portadaHTML = curso.portada
    ? `<img src="${backendURL}${curso.portada}" alt="${curso.titulo}" class="curso-portada-pequena">`
    : '';

  const porcentajeInicial = calcularPorcentajeProgreso();
  const totalModulos      = curso.modulos ? curso.modulos.length : 0;
  const totalPreguntas    = curso.evaluaciones ? curso.evaluaciones.length : 0;

  // Banner de curso completado
  let bannerCompletado = '';
  if (cursoYaFinalizado) {
    bannerCompletado = `
      <div style="background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;border-radius:12px;padding:18px 24px;margin-bottom:20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
        <i class="fas fa-trophy" style="font-size:2rem;flex-shrink:0;"></i>
        <div style="flex:1;">
          <div style="font-weight:700;font-size:1.05rem;margin-bottom:3px;">¡Curso Completado!</div>
          <div style="opacity:.9;font-size:.88rem;">Ya finalizaste este curso${notaEvaluacion !== null ? ` con <strong>${notaEvaluacion}%</strong> en la evaluación` : ''}. Puedes seguir revisando el contenido.</div>
        </div>
        <a href="/capacitrack/backend/generar_certificado.php?usuario_id=${usuarioId}&curso_id=${cursoId}" target="_blank"
           style="background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;padding:8px 18px;border-radius:8px;text-decoration:none;font-size:.85rem;white-space:nowrap;flex-shrink:0;">
          <i class="fas fa-download"></i> Descargar Certificado
        </a>
      </div>`;
  }

  const html = `
    ${bannerCompletado}
    <div class="curso-header">
      <div class="curso-info-grid">
        ${portadaHTML}
        <div class="curso-info-texto">
          <h1 class="curso-titulo">${curso.titulo}</h1>
          <div class="curso-meta">
            <span><i class="fas fa-user"></i> ${curso.creador_nombre || 'Desconocido'}</span>
            <span><i class="fas fa-calendar"></i> ${formatearFecha(curso.creado_en)}</span>
            <span><i class="fas fa-book"></i> ${totalModulos} módulos</span>
            <span><i class="fas fa-question-circle"></i> ${totalPreguntas} preguntas</span>
          </div>
          <div class="curso-descripcion">${curso.descripcion}</div>
        </div>
        <div class="progreso-curso-header">
          <div class="progreso-header"><span>Progreso</span></div>
          <div class="progreso-porcentaje">${porcentajeInicial}%</div>
          <div class="barra-progreso">
            <span class="barra-progreso-fill" style="width: ${porcentajeInicial}%;"></span>
          </div>
          ${notaEvaluacion !== null ? `<div style="margin-top:8px;font-size:.82rem;color:#555;"><i class="fas fa-star" style="color:#f59e0b;"></i> Evaluación: <strong>${notaEvaluacion}%</strong></div>` : ''}
          ${intentosEvaluacion > 0 ? `<div style="font-size:.78rem;color:#999;margin-top:3px;">Intentos: ${intentosEvaluacion}</div>` : ''}
        </div>
      </div>
    </div>

    <div class="curso-container">
      <aside class="sidebar-modulos">
        <h3 class="sidebar-titulo"><i class="fas fa-list"></i> Contenido del Curso</h3>
        <div id="menuModulos"></div>
      </aside>
      <div class="contenido-area">
        <div id="contenidoActual"></div>
      </div>
    </div>
  `;

  document.getElementById('cursoContainer').innerHTML = html;
  generarMenuNavegacion();
  mostrarContenido(0);
}

function generarMenuNavegacion() {
  const menuDiv = document.getElementById('menuModulos');
  if (!menuDiv) return;
  let html = '';

  if (cursoData.modulos && cursoData.modulos.length > 0) {
    cursoData.modulos.forEach((mod, index) => {
      const estaCompletado = modulosCompletados.includes(Number(mod.id));
      const esActivo       = index === indiceActual;
      html += `
        <div class="modulo-nav-item ${esActivo ? 'active' : ''} ${estaCompletado ? 'completado' : ''}"
             onclick="cambiarContenido(${index})">
          <i class="fas fa-${obtenerIconoTipo(mod.tipo_contenido)} icono"></i>
          <span class="modulo-nav-texto">Módulo ${index + 1}: ${mod.titulo}</span>
          ${estaCompletado ? '<i class="fas fa-check-circle check-completado"></i>' : ''}
        </div>`;
    });
  }

  if (cursoData.evaluaciones && cursoData.evaluaciones.length > 0) {
    const idxEval     = cursoData.modulos.length;
    const esActivo    = idxEval === indiceActual;
    const nota        = notaEvaluacion ?? (evaluacionCalificada ? calcularPorcentajeEvaluacion() : -1);
    const estaCompleta = evaluacionCalificada && nota >= 80;
    const reprobada    = evaluacionCalificada && nota < 80 && nota >= 0;
    html += `
      <div class="modulo-nav-item ${esActivo ? 'active' : ''} ${estaCompleta ? 'completado' : ''}"
           onclick="cambiarContenido(${idxEval})">
        <i class="fas fa-clipboard-check icono"></i>
        <span class="modulo-nav-texto">Evaluación Final${nota >= 0 && evaluacionCalificada ? ` (${nota}%)` : ''}</span>
        ${estaCompleta  ? '<i class="fas fa-check-circle check-completado"></i>' : ''}
        ${reprobada     ? '<i class="fas fa-times-circle" style="color:#ef4444;font-size:1.1rem;margin-left:auto;"></i>' : ''}
      </div>`;
  }

  menuDiv.innerHTML = html;
}

function cambiarContenido(nuevoIndice) {
  indiceActual = nuevoIndice;
  mostrarContenido(nuevoIndice);
  generarMenuNavegacion();
}

function mostrarContenido(index) {
  const contenidoDiv = document.getElementById('contenidoActual');
  if (!contenidoDiv) return;
  const totalModulos = cursoData.modulos ? cursoData.modulos.length : 0;
  if (index < totalModulos) {
    contenidoDiv.innerHTML = generarHTMLModulo(cursoData.modulos[index], index);
  } else if (cursoData.evaluaciones && cursoData.evaluaciones.length > 0) {
    contenidoDiv.innerHTML = generarHTMLEvaluacion();
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function generarHTMLModulo(modulo, index) {
  let contenidoHTML = '';
  if (modulo.archivo && modulo.archivo !== '') {
    const extension  = obtenerExtension(modulo.archivo);
    const tipoArchivo = modulo.tipo_contenido || detectarTipoArchivo(extension);
    contenidoHTML = generarVisualizadorArchivo(modulo.archivo, tipoArchivo, extension, modulo.titulo);
  } else {
    contenidoHTML = '<div class="no-contenido">Este módulo no tiene archivos adjuntos</div>';
  }

  const estaCompletado  = modulosCompletados.includes(Number(modulo.id));
  const totalModulos    = cursoData.modulos.length;
  const tieneEvaluacion = cursoData.evaluaciones && cursoData.evaluaciones.length > 0;
  const esUltimo        = index === totalModulos - 1;

  return `
    <div class="contenido-header">
      <span class="contenido-tipo"><i class="fas fa-${obtenerIconoTipo(modulo.tipo_contenido)}"></i> ${modulo.tipo_contenido || 'Módulo'}</span>
      <h2 class="contenido-titulo">Módulo ${index + 1}: ${modulo.titulo}</h2>
      <p class="contenido-descripcion">${modulo.descripcion || 'Sin descripción'}</p>
    </div>
    <div style="margin: 25px 0;">${contenidoHTML}</div>
    <div class="modulo-completado ${estaCompletado ? 'completado' : ''}" onclick="this.querySelector('input').click()">
      <input type="checkbox" id="checkbox_${index}" ${estaCompletado ? 'checked' : ''}
             onclick="event.stopPropagation(); marcarModuloCompletado(${index}, this)">
      <label for="checkbox_${index}"><i class="fas fa-check-circle"></i> Marcar como completado</label>
    </div>
    <div class="navegacion-botones">
      <button class="btn btn-secondary" onclick="navegarAnterior()" ${index === 0 ? 'disabled' : ''}>
        <i class="fas fa-arrow-left"></i> Anterior
      </button>
      <button class="btn btn-primary" onclick="navegarSiguiente()">
        ${esUltimo && tieneEvaluacion ? 'Ir a Evaluación' : 'Siguiente'} <i class="fas fa-arrow-right"></i>
      </button>
    </div>`;
}

function generarHTMLEvaluacion() {
  const tieneRespuestasLocales = Object.keys(respuestasEvaluacion).length > 0;

  // Evaluación ya calificada y cargada desde BD (sin respuestas locales en memoria)
  if (evaluacionCalificada && !tieneRespuestasLocales) {
    const nota    = notaEvaluacion ?? 0;
    const aprobado = nota >= 80;
    return `
      <div class="contenido-header">
        <span class="contenido-tipo"><i class="fas fa-clipboard-check"></i> Evaluación</span>
        <h2 class="contenido-titulo">Evaluación Final</h2>
        <p class="contenido-descripcion">Resultado de tu evaluación guardada.</p>
      </div>
      <div class="evaluacion-resultado ${aprobado ? 'aprobado' : 'reprobado'}" style="display:block;">
        <h3><i class="fas fa-${aprobado ? 'check-circle' : 'times-circle'}"></i> ${aprobado ? '¡Evaluación aprobada!' : 'Evaluación no aprobada'}</h3>
        <p style="font-size:1.3rem;margin:15px 0;">Calificación: <strong>${nota}%</strong></p>
        <p>Intentos realizados: <strong>${intentosEvaluacion}</strong></p>
        ${aprobado
          ? `<p style="margin-top:10px;opacity:.85;">¡Felicidades! Puedes descargar tu certificado desde el perfil o con el botón de arriba.</p>`
          : `<p style="margin-top:10px;">Necesitas al menos 80% para aprobar el curso.</p>
             <button class="btn btn-primary" onclick="permitirNuevoIntento()" style="margin-top:15px;">
               <i class="fas fa-redo"></i> Intentar de nuevo
             </button>`}
      </div>
      <div class="navegacion-botones">
        <button class="btn btn-secondary" onclick="navegarAnterior()"><i class="fas fa-arrow-left"></i> Volver a Módulos</button>
        ${aprobado && !cursoYaFinalizado
          ? `<button class="btn btn-primary" onclick="finalizarCurso()">Finalizar Curso <i class="fas fa-graduation-cap"></i></button>`
          : ''}
      </div>`;
  }

  // Evaluación con preguntas (nueva o ya respondida en esta sesión)
  let preguntasHTML = '';
  cursoData.evaluaciones.forEach((pregunta, index) => {
    let opcionesHTML = '';
    if (pregunta.tipo === 'opcion' && pregunta.opciones) {
      const opciones = JSON.parse(pregunta.opciones);
      opcionesHTML = '<div class="opciones-lista">';
      opciones.forEach((opcion, i) => {
        const letra           = String.fromCharCode(65 + i);
        const respGuardada    = respuestasEvaluacion[index];
        const estaSeleccionada = respGuardada && respGuardada.seleccionada === letra;
        const esCorrecta      = letra === pregunta.respuesta_correcta;
        let claseOpcion = '';
        if (evaluacionCalificada) {
          if (estaSeleccionada && esCorrecta)   claseOpcion = 'correcta-mostrada';
          else if (estaSeleccionada && !esCorrecta) claseOpcion = 'incorrecta-mostrada';
          else if (esCorrecta)                  claseOpcion = 'correcta-mostrada';
        }
        opcionesHTML += `
          <div class="opcion ${claseOpcion} ${evaluacionCalificada ? 'disabled' : ''}"
               onclick="${!evaluacionCalificada ? `seleccionarOpcion(${index}, '${letra}', this)` : ''}">
            <input type="radio" name="pregunta_${index}" value="${letra}"
                   ${estaSeleccionada ? 'checked' : ''} ${evaluacionCalificada ? 'disabled' : ''}
                   onclick="event.stopPropagation(); ${!evaluacionCalificada ? `seleccionarOpcion(${index}, '${letra}', this.parentElement)` : ''}">
            <label>${letra}) ${opcion}</label>
          </div>`;
      });
      opcionesHTML += '</div>';
    }

    let imagenHTML = '';
    if (pregunta.imagen && pregunta.imagen !== '') {
      const urlImagen = `${backendURL}${pregunta.imagen}`;
      imagenHTML = `<div style="margin:15px 0;"><img src="${urlImagen}" class="modulo-imagen" onclick="openModal('${urlImagen}')" onerror="this.style.display='none'"></div>`;
    }

    preguntasHTML += `
      <div class="pregunta-item">
        <div class="pregunta-numero">Pregunta ${index + 1}</div>
        <div class="pregunta-texto">${pregunta.pregunta}</div>
        ${imagenHTML}
        ${opcionesHTML}
      </div>`;
  });

  let resultadoHTML = '';
  if (evaluacionCalificada) {
    const nota    = notaEvaluacion ?? calcularPorcentajeEvaluacion();
    const aprobado = nota >= 80;
    const correctas = Object.values(respuestasEvaluacion).filter(r => r.correcta).length;
    resultadoHTML = `
      <div class="evaluacion-resultado ${aprobado ? 'aprobado' : 'reprobado'}" style="display:block;">
        <h3><i class="fas fa-${aprobado ? 'check-circle' : 'times-circle'}"></i> ${aprobado ? '¡Felicidades! Has aprobado' : 'No has aprobado'}</h3>
        <p style="font-size:1.2rem;margin:15px 0;">Calificación: <strong>${nota}%</strong></p>
        <p>Respuestas correctas: ${correctas} de ${cursoData.evaluaciones.length}</p>
        <p style="margin-top:4px;font-size:.85rem;opacity:.75;">Intento #${intentosEvaluacion}</p>
        ${!aprobado ? `
          <p style="margin-top:15px;">Necesitas al menos 80% para aprobar el curso.</p>
          <button class="btn btn-primary" onclick="reiniciarEvaluacion()" style="margin-top:15px;">
            <i class="fas fa-redo"></i> Volver a intentar
          </button>` : ''}
      </div>`;
  }

  return `
    <div class="contenido-header">
      <span class="contenido-tipo"><i class="fas fa-clipboard-check"></i> Evaluación</span>
      <h2 class="contenido-titulo">Evaluación Final</h2>
      <p class="contenido-descripcion">Responde las siguientes preguntas. Necesitas obtener al menos 80% para completar el curso.</p>
    </div>
    <div class="evaluacion-container">
      ${preguntasHTML}
      ${!evaluacionCalificada
        ? `<button class="btn btn-primary" onclick="calificarEvaluacion()" style="width:100%;margin-top:20px;font-size:1.1rem;">
             <i class="fas fa-check"></i> Enviar Evaluación
           </button>`
        : ''}
      ${resultadoHTML}
    </div>
    <div class="navegacion-botones">
      <button class="btn btn-secondary" onclick="navegarAnterior()"><i class="fas fa-arrow-left"></i> Volver a Módulos</button>
      ${evaluacionCalificada && (notaEvaluacion ?? calcularPorcentajeEvaluacion()) >= 80 && !cursoYaFinalizado
        ? `<button class="btn btn-primary" onclick="finalizarCurso()">Finalizar Curso <i class="fas fa-graduation-cap"></i></button>`
        : ''}
    </div>`;
}

function permitirNuevoIntento() {
  evaluacionCalificada = false;
  notaEvaluacion       = null;
  respuestasEvaluacion = {};
  mostrarContenido(indiceActual);
  generarMenuNavegacion();
}

function seleccionarOpcion(preguntaIndex, opcion, elemento) {
  if (evaluacionCalificada) return;
  respuestasEvaluacion[preguntaIndex] = {
    seleccionada: opcion,
    correcta: opcion === cursoData.evaluaciones[preguntaIndex].respuesta_correcta
  };
  elemento.parentElement.querySelectorAll('.opcion').forEach(o => o.classList.remove('seleccionada'));
  elemento.classList.add('seleccionada');
}

function calcularPorcentajeEvaluacion() {
  if (Object.keys(respuestasEvaluacion).length === 0) return notaEvaluacion ?? 0;
  const total    = cursoData.evaluaciones.length;
  const correctas = Object.values(respuestasEvaluacion).filter(r => r.correcta).length;
  return Math.round((correctas / total) * 100);
}

async function calificarEvaluacion() {
  if (Object.keys(respuestasEvaluacion).length < cursoData.evaluaciones.length) {
    alert('Por favor responde todas las preguntas antes de enviar la evaluación.');
    return;
  }
  evaluacionCalificada = true;
  intentosEvaluacion++;
  notaEvaluacion = calcularPorcentajeEvaluacion();

  actualizarBarraProgreso();
  await guardarProgresoEnDB(calcularPorcentajeProgreso(), {
    nota_evaluacion: notaEvaluacion,
    incrementar_intentos: true
  });

  mostrarContenido(indiceActual);
  generarMenuNavegacion();
}

function reiniciarEvaluacion() {
  respuestasEvaluacion = {};
  evaluacionCalificada = false;
  notaEvaluacion       = null;
  mostrarContenido(indiceActual);
  actualizarBarraProgreso();
  generarMenuNavegacion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function marcarModuloCompletado(index, checkbox) {
  const modulo  = cursoData.modulos[index];
  const moduloId = Number(modulo.id);
  const marcado  = checkbox.checked;

  if (marcado) {
    if (!modulosCompletados.includes(moduloId)) modulosCompletados.push(moduloId);
    checkbox.parentElement.classList.add('completado');
  } else {
    modulosCompletados = modulosCompletados.filter(id => id !== moduloId);
    checkbox.parentElement.classList.remove('completado');
  }

  // Guardar en BD
  await fetch('/capacitrack/backend/modulos/marcar_completado.php', {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ modulo_id: moduloId, completado: marcado })
  });

  actualizarBarraProgreso();
  await guardarProgresoEnDB(calcularPorcentajeProgreso());
  generarMenuNavegacion();
}

function navegarAnterior() {
  if (indiceActual > 0) cambiarContenido(indiceActual - 1);
}

function navegarSiguiente() {
  const totalModulos    = cursoData.modulos ? cursoData.modulos.length : 0;
  const tieneEvaluacion = cursoData.evaluaciones && cursoData.evaluaciones.length > 0;
  const maxIndice       = totalModulos + (tieneEvaluacion ? 1 : 0) - 1;
  if (indiceActual < maxIndice) cambiarContenido(indiceActual + 1);
}

async function finalizarCurso() {
  const porcentaje = calcularPorcentajeProgreso();
  if (porcentaje < 100) {
    alert('Completa todos los módulos y aprueba la evaluación con al menos 80% para finalizar el curso.');
    return;
  }
  const res  = await fetch(`${backendURL}guardar_progreso.php`, {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ curso_id: cursoId, porcentaje: 100, nota_evaluacion: notaEvaluacion })
  });
  const data = await res.json();
  if (data.success) { cursoYaFinalizado = true; mostrarModalCertificado(); }
  else              { alert('Error al marcar curso como completado: ' + (data.message || '')); }
}

function mostrarModalCertificado() {
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.style.display = 'flex';
  modal.innerHTML = `
    <div class="modal-box" style="max-width:500px;">
      <h2 style="color:#2e7d32;margin-bottom:15px;"><i class="fas fa-trophy"></i> ¡Felicidades!</h2>
      <p style="font-size:1.1rem;margin-bottom:10px;">Has completado exitosamente:<br><strong>${cursoData.titulo}</strong></p>
      ${notaEvaluacion !== null ? `<p style="margin-bottom:20px;"><i class="fas fa-star" style="color:#f59e0b;"></i> Evaluación: <strong>${notaEvaluacion}%</strong></p>` : ''}
      <div style="margin:20px 0;">
        <button class="btn btn-primary" onclick="descargarCertificado()" style="width:100%;margin-bottom:10px;">
          <i class="fas fa-download"></i> Descargar Certificado
        </button>
        <button class="btn btn-secondary" onclick="volverMisCursos()" style="width:100%;">
          <i class="fas fa-arrow-left"></i> Ir a Mis Cursos
        </button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

function descargarCertificado() {
  window.open(`${backendURL}generar_certificado.php?usuario_id=${usuarioId}&curso_id=${cursoId}`, '_blank');
}

function volverMisCursos() { window.location.href = 'mis-cursos.html'; }

function getYouTubeEmbedUrl(url) {
  const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
  return match ? `https://www.youtube.com/embed/${match[1]}` : null;
}

function generarVisualizadorArchivo(rutaArchivo, tipo, extension, titulo) {
  // Detectar URL de YouTube
  if (tipo === 'video' || /youtube\.com|youtu\.be/.test(rutaArchivo)) {
    const embedUrl = getYouTubeEmbedUrl(rutaArchivo);
    if (embedUrl) {
      return `<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:8px;">
        <iframe src="${embedUrl}" title="${titulo}"
          style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;border-radius:8px;"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen></iframe>
      </div>`;
    }
    return `<div class="no-contenido"><i class="fab fa-youtube" style="font-size:2.5rem;color:#ff0000;margin-bottom:10px;display:block;"></i>URL de YouTube no válida o no disponible</div>`;
  }

  const urlCompleta = `${backendURL}${rutaArchivo}`;

  if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp'].includes(extension) || tipo === 'imagen') {
    return `
      <img src="${urlCompleta}" 
           alt="${titulo}" 
           class="modulo-imagen"
           onclick="openModal('${urlCompleta}')"
           onerror="this.parentElement.innerHTML='<div class=\\'no-contenido\\'>Error al cargar la imagen</div>'">
    `;
  }
  
  if (extension === 'pdf' || tipo === 'pdf') {
    return `
      <iframe src="${urlCompleta}" 
              class="modulo-pdf"
              title="${titulo}"></iframe>
      <div style="margin-top:10px;">
        <a href="${urlCompleta}" target="_blank" class="btn-descargar">
          <i class="fas fa-download"></i> Descargar PDF
        </a>
      </div>
    `;
  }
  
  // Video local (legacy — ahora los videos usan YouTube)
  if (['mp4', 'webm'].includes(extension)) {
    return `
      <video controls class="modulo-video">
        <source src="${urlCompleta}" type="video/${extension}">
        Tu navegador no soporta el elemento de video.
      </video>
    `;
  }
  
  if (['mp3', 'wav', 'ogg'].includes(extension)) {
    return `
      <audio controls style="width:100%;">
        <source src="${urlCompleta}" type="audio/${extension}">
        Tu navegador no soporta el elemento de audio.
      </audio>
      <div style="margin-top:10px;">
        <a href="${urlCompleta}" download class="btn-descargar">
          <i class="fas fa-download"></i> Descargar Audio
        </a>
      </div>
    `;
  }
  
  const iconos = {
    'doc': 'file-word', 'docx': 'file-word',
    'xls': 'file-excel', 'xlsx': 'file-excel',
    'ppt': 'file-powerpoint', 'pptx': 'file-powerpoint',
    'txt': 'file-alt',
    'zip': 'file-archive', 'rar': 'file-archive'
  };
  
  const icono = iconos[extension] || 'file';
  const nombreArchivo = rutaArchivo.split('/').pop();
  
  return `
    <div class="archivo-descarga">
      <div class="archivo-icono">
        <i class="fas fa-${icono}"></i>
      </div>
      <div class="archivo-info">
        <div class="archivo-nombre">${nombreArchivo}</div>
        <div class="archivo-detalles">Tipo: ${extension.toUpperCase()} • ${tipo || 'Documento'}</div>
      </div>
      <a href="${urlCompleta}" download class="btn-descargar">
        <i class="fas fa-download"></i> Descargar
      </a>
    </div>
  `;
}

function obtenerExtension(rutaArchivo) {
  return rutaArchivo.split('.').pop().toLowerCase();
}

function detectarTipoArchivo(extension) {
  const tipos = {
    'jpg': 'imagen', 'jpeg': 'imagen', 'png': 'imagen', 'gif': 'imagen', 'webp': 'imagen',
    'pdf': 'pdf',
    'mp4': 'video', 'webm': 'video', 'ogg': 'video',
    'doc': 'documento', 'docx': 'documento', 'txt': 'documento',
    'xls': 'documento', 'xlsx': 'documento',
    'ppt': 'documento', 'pptx': 'documento'
  };
  return tipos[extension] || 'documento';
}

function obtenerIconoTipo(tipo) {
  const iconos = {
    'video': 'video',
    'pdf': 'file-pdf',
    'imagen': 'image',
    'documento': 'file-alt'
  };
  return iconos[tipo] || 'book';
}

function openModal(imageSrc) {
  const modal = document.getElementById('imageModal');
  const modalImg = document.getElementById('modalImage');
  modal.classList.add('active');
  modalImg.src = imageSrc;
}

function closeModal() {
  document.getElementById('imageModal').classList.remove('active');
}

function mostrarError(mensaje) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('errorContainer').style.display = 'block';
  document.getElementById('errorMessage').textContent = mensaje;
}

function formatearFecha(fecha) {
  const date = new Date(fecha);
  return date.toLocaleDateString('es-MX', { 
    year: 'numeric', 
    month: 'long', 
    day: 'numeric' 
  });
}

function abrirModalCerrarSesion(e) {
  e.preventDefault();
  document.getElementById("modalCerrarSesion").style.display = "flex";
}

function cerrarModal() {
  document.getElementById("modalCerrarSesion").style.display = "none";
}

function confirmarCerrarSesion() {
  window.location.href = "index.html";
}
const menuToggle = document.getElementById('menu-toggle');
const navMenu = document.getElementById('nav-menu');

menuToggle.addEventListener('click', () => {
  navMenu.classList.toggle('show'); // Agrega/quita clase para mostrar menú
});
</script>
