<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil Admin | CapaciTrack</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f7fa;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* LOGO EN TOPBAR */
    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-container img {
      height: 60px;
      width: auto;
    }

    .logo-container a {
      font-size: 1.8rem;
      font-weight: 700;
      color: #2e7d32;
      text-decoration: none;
    }

    .logo-container span {
      font-size: 1.8rem;
      font-weight: 700;
      color: #2e7d32;
    }

    /* TOPBAR */
    .topbar {
      background-color: #e8f5e9;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #dcedc8;
    }

    #bienvenida {
      color: #2e7d32;
      font-weight: 600;
    }

    .topbar nav a {
      margin-left: 25px;
      color: #2e7d32;
      text-decoration: none;
      font-weight: 500;
      transition: 0.2s;
    }

    .topbar nav a:hover {
      color: #1b5e20;
    }

    /* CONTENEDOR */
    .dashboard-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* SIDEBAR */
    .sidebar {
      width: 240px;
      background-color: #e8f5e9;
      padding: 20px 0;
      border-right: 1px solid #dcedc8;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar-item {
      padding: 14px 25px;
      color: #2e7d32;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: 0.2s;
    }

    .sidebar-item:hover {
      background-color: #c8e6c9;
      color: #1b5e20;
    }

    /* CONTENIDO PRINCIPAL */
    .main-content {
      flex: 1;
      padding: 30px;
      background-color: #f5f7fa;
      overflow-y: auto;
    }

    /* PERFIL */
    .perfil-container {
      max-width: 800px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }

    h2, h3 {
      color: #2e7d32;
      margin-bottom: 15px;
    }

    /* PERFIL IMAGEN */
    .perfil-img {
      text-align: center;
      margin-bottom: 25px;
      padding-bottom: 25px;
      border-bottom: 1px solid #e0e0e0;
    }

    .perfil-img img {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      background: #ccc;
      border: 3px solid #2e7d32;
      margin-bottom: 15px;
    }

    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 20px;
      background: #2e7d32;
      color: #fff;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      transition: 0.2s;
    }

    .btn:hover {
      background: #1b5e20;
      transform: translateY(-1px);
    }

    .campo {
      margin-top: 20px;
    }

    .campo label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #555;
    }

    .campo input,
    .campo select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
      transition: 0.2s;
    }

    .campo input:focus,
    .campo select:focus {
      outline: none;
      border-color: #2e7d32;
      box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
    }

    /* FOOTER */
    footer {
      background-color: #e8f5e9;
      padding: 15px;
      text-align: center;
      color: #2e7d32;
      border-top: 1px solid #dcedc8;
      position: relative;
    }

    .footer-logo {
      position: absolute;
      bottom: 5px;
      opacity: 0.9;
    }

    .footer-logo.left {
      left: 20px;
      width: 100px;
    }

    .footer-logo.right {
      right: 20px;
      width: 110px;
    }

    /*cerrar sesion*/
    .modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.modal-box {
  background: #fff;
  padding: 30px;
  width: 400px;
  border-radius: 14px;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  animation: aparecer 0.25s ease;
}

.modal-box h2 {
  margin-bottom: 10px;
  color: #19aa1e;
}

.modal-box p {
  color: #555;
  margin-bottom: 25px;
}

.modal-actions {
  display: flex;
  justify-content: center;
  gap: 15px;
}

.btn-cancelar {
  background: #e5e5e5;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  cursor: pointer;
}

.btn-confirmar {
  background: #19aa1e;
  color: white;
  border: none;
  padding: 10px 22px;
  border-radius: 8px;
  cursor: pointer;
}

.btn-confirmar:hover {
  background: #19aa1e;
}

@keyframes aparecer {
  from {
    opacity: 0;
    transform: scale(0.9);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* Icono hamburguesa */
.menu-toggle {
  display: none;
  font-size: 28px;
  cursor: pointer;
  color: #2e7d32;
}

/* Responsive: menú hamburguesa */
@media screen and (max-width: 768px) {
  .topbar nav {
    display: none; /* Oculto por defecto */
    flex-direction: column;
    gap: 0;
    position: absolute;
    top: 70px;
    right: 0;
    background-color: #e8f5e9;
    width: 200px;
    border-left: 1px solid #dcedc8;
    padding: 10px 0;
    z-index: 999;
  }

  .topbar nav a {
    padding: 12px 20px;
    border-top: 1px solid #dcedc8;
    margin: 0;
  }

  .menu-toggle {
    display: block; /* Mostrar hamburguesa en móvil */
  }

  /* Cuando el menú está abierto */
  nav.show {
    display: flex;
  }
}

/* ===== SIDEBAR ESCRITORIO ===== */
.sidebar {
  width: 250px;
  background-color: #e8f5e9;
  border-right: 1px solid #c8e6c9;
  display: flex;
  flex-direction: column;
  padding-top: 20px;
}

/* Botón hamburguesa sidebar */
.sidebar-toggle {
  display: none;
  font-size: 24px;
  cursor: pointer;
  color: #2e7d32;
}

/* ===== MODO MÓVIL ===== */
@media screen and (max-width: 768px) {

  .sidebar {
    position: fixed;
    top: 0;
    left: -260px; /* Oculto */
    height: 100%;
    z-index: 1000;
    transition: 0.3s ease;
    box-shadow: 2px 0 10px rgba(0,0,0,0.2);
  }

  .sidebar.show {
    left: 0; /* Se muestra */
  }

  .sidebar-toggle {
    display: block;
  }
}
.sidebar-toggle {
  cursor: pointer;
  font-size: 22px;
  color: #2e7d32;
  transition: transform 0.3s ease;
}

.sidebar-toggle.rotate {
  transform: rotate(90deg);
}
.sidebar-toggle {
  margin-left: 15px;   /* Ajusta el espacio hacia la derecha */
}

  </style>
</head>

<body>

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="logo-container">
      <img src="assets/logo.png" alt="Logo CapaciTrack">
      <a href="paneladmin.html">CapaciTrack</a>
    </div>
    
    <div id="bienvenida">Bienvenido</div>
    
    <div class="menu-toggle" id="menu-toggle">
  <i class="fas fa-bars"></i> <!-- Icono hamburguesa -->
</div>
    <nav id="nav-menu">
      <a href="registrousuarios.html">Registro de Usuarios</a>
      <a href="registrodocs.html">Registro de Documentos</a>
      <a href="perfil-admin.html">Perfil</a>
         <a href="#" onclick="abrirModalCerrarSesion(event)">Cerrar Sesión</a>
    </nav>
  </header>

  <!-- CONTENEDOR -->
  <div class="dashboard-container">

  <!-- SIDEBAR -->
<div class="sidebar-toggle" id="sidebar-toggle">
  <i class="fas fa-chevron-right"></i>
</div>

<aside class="sidebar" id="sidebar">
  <a href="crear-curso.html" class="sidebar-item">
    <i class="fas fa-plus-circle"></i>Agregar Curso
  </a>
  <a href="agregar-usuario.html" class="sidebar-item">
    <i class="fas fa-user-plus"></i>Agregar Usuario
  </a>
  <a href="reportes.html" class="sidebar-item">
    <i class="fas fa-chart-bar"></i>Reportes
  </a>
  <a href="ver-cursos.html" class="sidebar-item">
    <i class="fas fa-play-circle"></i>Ver Cursos
  </a>
</aside>

    <!-- CONTENIDO PERFIL -->
    <main class="main-content">
      <div class="perfil-container">
        <div class="card">
          <h2><i class="fas fa-user-circle"></i> Perfil del Moderador</h2>
          
          <div class="perfil-img">
            <img id="avatar"
                 src="https://ui-avatars.com/api/?name=Admin&background=2e7d32&color=fff&size=256"
                 alt="Foto de perfil">

            <label class="btn">
              <i class="fas fa-camera"></i> Cambiar foto
              <input type="file" id="fotoPerfil" accept="image/*" hidden onchange="subirFotoPerfil()">
            </label>
            
            <h3 id="nombreUsuario">Moderador</h3>
          </div>

          <div class="campo">
            <label><i class="fas fa-phone"></i> Número de teléfono</label>
            <input type="text" id="telefono" placeholder="Ej. 55 1234 5678">
          </div>

          <div class="campo">
            <label><i class="fas fa-building"></i> Razón social</label>
            <select id="razon_social">
              <option value="">Selecciona la razón</option>
              <option value="Grupo Gusi SPR DE RL DE CV">Grupo Gusi SPR DE RL DE CV</option>
              <option value="Productores Ganaderos Gusi">Productores Ganaderos Gusi</option>
              <option value="Transportes Gusi">Transportes Gusi</option>
              <option value="GS Talentos Innovadores">GS Talentos Innovadores</option>
            </select>
          </div>

          <button class="btn" onclick="guardarPerfil()" style="margin-top: 25px; width: 100%;">
            <i class="fas fa-save"></i> Guardar cambios
          </button>
        </div>
      </div>
    </main>

  </div>

  <!-- FOOTER -->
  <footer>
    <img src="assets/esr.png" class="footer-logo left" alt="ESR">
    <p>&copy; 2026 CapaciTrack. Todos los derechos reservados.</p>
    <img src="assets/Grupo-Gusi.png" class="footer-logo right" alt="Grupo Gusi">
  </footer>

  <!-- JAVASCRIPT -->
  <script>
    // ===== CARGAR USUARIO Y PERFIL AL INICIO =====
    fetch("/capacitrack/backend/auth/usuario_actual.php", {
      credentials: "include"
    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        document.getElementById("bienvenida").textContent = "Bienvenido, " + data.nombre;
        document.getElementById("nombreUsuario").textContent = data.nombre;
        
        // Actualizar avatar con iniciales
        const avatar = document.getElementById("avatar");
        const iniciales = data.nombre.split(' ').map(n => n[0]).join('').substring(0, 2);
        avatar.src = `https://ui-avatars.com/api/?name=${iniciales}&background=2e7d32&color=fff&size=256`;
        
        cargarPerfil();
      }
    })
    .catch(err => {
      console.error("Error al cargar usuario:", err);
    });

    // ===== CARGAR PERFIL =====
    function cargarPerfil() {
      fetch("/capacitrack/backend/usuarios/obtener_perfil.php", {
        credentials: "include"
      })
      .then(res => res.json())
      .then(data => {
        if (!data.success) return;

        // Teléfono y razón social
        document.getElementById("telefono").value = data.telefono ?? "";
        document.getElementById("razon_social").value = data.razon_social ?? "";

        // ===== IMAGEN DE PERFIL =====
        if (data.perfil) {
          document.getElementById("avatar").src = "/capacitrack/" + data.perfil + "?t=" + Date.now();
        }
      })
      .catch(err => {
        console.error("Error al cargar perfil:", err);
      });
    }

    // ===== GUARDAR PERFIL =====
    function guardarPerfil() {
      fetch("/capacitrack/backend/usuarios/actualizar_perfil.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({
          telefono: document.getElementById("telefono").value,
          razon_social: document.getElementById("razon_social").value
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert("✅ Perfil actualizado correctamente");
        } else {
          alert("❌ Error: " + (data.message || "No se pudo actualizar"));
        }
      })
      .catch(err => {
        alert("❌ Error al guardar perfil");
        console.error(err);
      });
    }

    // ===== SUBIR FOTO DE PERFIL =====
    function subirFotoPerfil() {
      const input = document.getElementById("fotoPerfil");
      const file = input.files[0];
      
      if (!file) return;
      
      const formData = new FormData();
      formData.append("foto", file);
      
      fetch("/capacitrack/backend/usuarios/subir_avatar.php", {
        method: "POST",
        credentials: "include",
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          // Actualizar imagen
          document.getElementById("avatar").src = "/capacitrack/" + data.ruta + "?t=" + Date.now();
          alert("✅ Foto de perfil actualizada");
        } else {
          alert("❌ Error: " + (data.message || "No se pudo subir la imagen"));
        }
      })
      .catch(err => {
        alert("❌ Error al subir la imagen");
        console.error(err);
      });
    }
  </script>

<!-- MODAL CERRAR SESIÓN -->
<div id="modalCerrarSesion" class="modal-overlay">
  <div class="modal-box">
    <h2>⚠️ Cerrar sesión</h2>
    <p>¿Seguro que deseas cerrar la sesión?</p>

    <div class="modal-actions">
      <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-confirmar" onclick="confirmarCerrarSesion()">Cerrar sesión</button>
    </div>
  </div>
</div>
<script>
function abrirModalCerrarSesion(e) {
  e.preventDefault();
  document.getElementById("modalCerrarSesion").style.display = "flex";
}

function cerrarModal() {
  document.getElementById("modalCerrarSesion").style.display = "none";
}

function confirmarCerrarSesion() {
  // Si usas sesiones o tokens, aquí los limpias
  // localStorage.clear();
  // sessionStorage.clear();

  window.location.href = "index.html";
}
//menu ham//
const menuToggle = document.getElementById('menu-toggle');
const navMenu = document.getElementById('nav-menu');

menuToggle.addEventListener('click', () => {
  navMenu.classList.toggle('show'); // Agrega/quita clase para mostrar menú
});

//menu lateral//
const sidebarToggle = document.getElementById('sidebar-toggle');
const sidebar = document.getElementById('sidebar');

sidebarToggle.addEventListener('click', () => {
  sidebar.classList.toggle('show');
  sidebarToggle.classList.toggle('rotate');
});
</script>

</body>
</html>
